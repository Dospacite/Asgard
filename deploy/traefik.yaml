global:
  checkNewVersion: false
  sendAnonymousUsage: false
api:
  dashboard: false
entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443
    transport:
      respondingTimeouts:
        # Traefik v3 defaults readTimeout to 60s, which caps how long a client
        # may take to send a request body. CI runners pushing multi-megabyte
        # build artifacts get cut off mid-body, surfacing as a 502/499 that
        # looks like a server fault.
        #
        # 1800s is deliberately generous: measured throughput from GitHub
        # runners to this host is 5-57 KB/s (against 22 MB/s to Cloudflare), so
        # the GitHub route is the constraint and a 7 MB artifact can legitimately
        # need 20 minutes. idleTimeout still bounds genuinely stalled clients.
        readTimeout: 1800s
        # idleTimeout must stay above the longest silence a browser SPA keeps on
        # an open connection, or its first request after that silence is written
        # to a connection we already tore down. The Directus admin app goes idle
        # after exactly 300s and then fires a single, unretried session probe: if
        # that probe fails the app decides the session expired and bounces the
        # editor to the login screen, discarding unsaved changes. At Traefik's
        # 180s default that probe was always the first write after a GOAWAY.
        idleTimeout: 600s
providers:
  file:
    directory: /data/traefik/dynamic
    watch: true
certificatesResolvers:
  letsencrypt:
    acme:
      email: ege@rousoftware.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
log:
  level: INFO
accessLog: {}

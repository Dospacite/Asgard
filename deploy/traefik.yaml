global:
  checkNewVersion: false
  sendAnonymousUsage: false
api:
  dashboard: false
entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443
providers:
  file:
    directory: /data/traefik/dynamic
    watch: true
certificatesResolvers:
  letsencrypt:
    acme:
      email: ege@rousoftware.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
log:
  level: INFO
accessLog: {}
